# ホームページの自動書き出しと公開（GitHub Pages）。まだ使っていない（公開を決めてから有効にする）。
# 動くきっかけは2つ（2026-10-25 に決定。microCMS の Webhook は使わない＝GitHub に書き込める鍵を microCMS に預けないため）：
#   1. 定期実行（日本時間 7時〜20時台の毎時13分・43分。夜の更新は朝7時台の回で反映される）
#      2026-11-14：毎時0分・30分の指定では、実測で1日3回ほど（7〜8時間おき）しか動かなかったため、混み合う時刻を外した。
#      GitHubの定期実行は遅れたり抜けたりするので、「30分で必ず反映」とは約束しない。急ぐときは 2 の手動実行。
#   2. GitHub の画面から手動で（急ぎの更新：Actions → build-and-publish → Run workflow。管理者が行う）
# 注意：公開リポジトリは60日間なにも動きがないと、定期実行が自動で無効になる（GitHub公式）。約45日ごとに Actions の画面で有効かを確かめる
#       （秘書/定期の手入れ.md の休止中の項目）。止まっていたら「Enable workflow」を押し、手動で1回実行する。
# 使う道具は、すり替えられないよう版を固有の番号で決め打ちにしている（2026-10-17。更新するときは番号ごと書き換える）。
# 2026-11-14：Node.js 20 廃止の警告が出ていたため、5つとも Node.js 24 対応の版へ上げた。
#   upload-pages-artifact は v4 から、名前が「.」で始まるファイル（site/.built.json など）を公開物に入れない。
# APIキーはリポジトリの Settings → Secrets and variables → Actions に MICROCMS_SERVICE_ID / MICROCMS_API_KEY として登録する。
name: build-and-publish

on:
  schedule:
    - cron: "13,43 22-23,0-11 * * *"
  workflow_dispatch:

# 権限は工程ごとに、必要な分だけ（2026-10-25）。全体の初期値は何も持たない。
#   書き出し（build）：リポジトリを読むだけ。APIキーと、管理画面の値を扱う工程なので、公開の権限は持たせない。
#   公開（deploy）　：Pagesへの公開と、その本人確認（id-token）だけ。リポジトリは読まない。
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 取ってきたあとに書き込みの権限を残さない
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: 写した画像・PDFを前回の分から引き継ぐ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            site/img/cms
            site/files/cms
          key: cms-assets-${{ github.run_id }}
          restore-keys: cms-assets-
      - name: 書き出し
        env:
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python3 -I build.py --release --source=cms
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
