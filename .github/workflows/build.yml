# ホームページの自動書き出しと公開（GitHub Pages）。まだ使っていない（公開を決めてから有効にする）。
# 動くきっかけは2つ（2026-10-25 に決定。microCMS の Webhook は使わない＝GitHub に書き込める鍵を microCMS に預けないため）：
#   1. 定期実行（日本時間 7時〜20時台の30分ごと。夜の更新は朝7時の回で反映される）
#   2. GitHub の画面から手動で（急ぎの更新：Actions → build-and-publish → Run workflow。管理者が行う）
# 注意：公開リポジトリは60日間なにも動きがないと、定期実行が自動で無効になる（GitHub公式）。約45日ごとに Actions の画面で有効かを確かめる
#       （秘書/定期の手入れ.md の休止中の項目）。止まっていたら「Enable workflow」を押し、手動で1回実行する。
# 使う道具は、すり替えられないよう版を固有の番号で決め打ちにしている（2026-10-17。更新するときは番号ごと書き換える）。
# APIキーはリポジトリの Settings → Secrets and variables → Actions に MICROCMS_SERVICE_ID / MICROCMS_API_KEY として登録する。
name: build-and-publish

on:
  schedule:
    - cron: "*/30 22-23,0-11 * * *"
  workflow_dispatch:

# 権限は工程ごとに、必要な分だけ（2026-10-25）。全体の初期値は何も持たない。
#   書き出し（build）：リポジトリを読むだけ。APIキーと、管理画面の値を扱う工程なので、公開の権限は持たせない。
#   公開（deploy）　：Pagesへの公開と、その本人確認（id-token）だけ。リポジトリは読まない。
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # 取ってきたあとに書き込みの権限を残さない
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: 写した画像・PDFを前回の分から引き継ぐ
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            site/img/cms
            site/files/cms
          key: cms-assets-${{ github.run_id }}
          restore-keys: cms-assets-
      - name: 書き出し
        env:
          MICROCMS_SERVICE_ID: ${{ secrets.MICROCMS_SERVICE_ID }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python3 -I build.py --release --source=cms
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
